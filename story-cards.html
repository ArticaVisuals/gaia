<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>The Story of a Keystone — Gaia</title>
<link rel="stylesheet" href="https://use.typekit.net/atn6inh.css">
<link rel="stylesheet" href="design-tokens.css">
<style>
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100dvh;
  overflow: hidden;
  background:
    linear-gradient(180deg, rgba(252,250,240,0.4) 13.94%, rgba(122,158,93,0.4) 100%),
    var(--paper-50);
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
  overscroll-behavior: none;
}

/* ── STAGE — fixed 402x874 Figma frame, scaled to fit viewport ── */
#stage {
  position: fixed;
  left: 50%; top: 50%;
  width: 402px;
  height: 874px;
  transform: translate(-50%, -50%);
  transform-origin: center;
  background:
    linear-gradient(180deg, rgba(252,250,240,0.4) 13.94%, rgba(122,158,93,0.4) 100%),
    var(--paper-50);
  overflow: hidden;
  touch-action: none;
}

/* ── TOOLBAR (overlay) ─────────────────────────────────────── */
.back-btn {
  position: absolute;
  left: 16px; top: 51px;
  width: 48px; height: 48px;
  border: none;
  padding: 0;
  background: transparent;
  border-radius: var(--radius-full);
  cursor: pointer;
  z-index: 10;
}
.back-btn .glass {
  position: absolute;
  inset: 0;
  border-radius: var(--radius-full);
  isolation: isolate;
  overflow: hidden;
  box-shadow: var(--glass-toolbar-shadow);
  backdrop-filter: blur(var(--glass-toolbar-blur)) saturate(var(--glass-toolbar-saturate));
  -webkit-backdrop-filter: blur(var(--glass-toolbar-blur)) saturate(var(--glass-toolbar-saturate));
}
.back-btn .glass::before {
  content: '';
  position: absolute; inset: 0;
  background: var(--glass-toolbar-fill);
}
.back-btn .glass::after {
  content: '';
  position: absolute; inset: 0;
  background: var(--glass-toolbar-highlight);
  mix-blend-mode: color-burn;
}
.back-btn .glass .depth {
  position: absolute; inset: 0;
  background: var(--glass-toolbar-depth);
  mix-blend-mode: darken;
}
.back-btn svg {
  position: relative;
  display: block;
  margin: 0 auto;
  z-index: 1;
}

/* ── PAGE COLUMN ───────────────────────────────────────────── */
#column {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: var(--space-16);
}

.species-pill {
  height: 32px;
  display: flex;
  align-items: center;
  padding: 0 var(--space-5);
  background: var(--brown-300);
  border: 1px solid var(--brown-200);
  border-radius: 250px;
  color: var(--paper-50);
  font-family: "Basier Circle Mono", ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 12px;
  line-height: 1.3;
  text-transform: uppercase;
  white-space: nowrap;
}

.story-title {
  margin-top: 16px;
  width: 353px;
  font-family: var(--font-serif);
  font-size: 56px;
  font-weight: 500;
  line-height: 0.97;
  letter-spacing: -0.87px;
  color: var(--olive);
  text-align: center;
  text-box: trim-both cap alphabetic;
}
.story-title em { font-style: italic; }

/* ── DECK ──────────────────────────────────────────────────── */
#deck {
  position: relative;
  margin-top: var(--space-10);
  width: 328px;
  height: 473px; /* 41px peek + 432px card */
  touch-action: none;
}

.card-slot {
  position: absolute;
  top: 0; left: 0;
  width: 328px;
  height: 432px;
  transform-origin: top left;
  will-change: transform;
  touch-action: none;
}

.learning-card {
  width: 100%;
  height: 100%;
  background: var(--paper-50);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding: var(--space-5);
}

.card-title {
  font-family: var(--font-serif);
  font-size: 32px;
  font-weight: 500;
  line-height: 0.98;
  letter-spacing: -0.5px;
  color: var(--brown-500);
  text-box: trim-both cap alphabetic;
  flex-shrink: 0;
}

.card-img-wrap {
  margin-top: var(--space-8);
  height: 182px;
  flex-shrink: 0;
  background: white;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  overflow: hidden;
  position: relative;
}
.card-img-wrap img {
  position: absolute;
  max-width: none;
  display: block;
  pointer-events: none;
  -webkit-user-drag: none;
}
.card-image--ecosystem {
  width: 105.7%;
  height: auto;
  left: -0.6%;
  top: 0.1%;
}
.card-image--acorn {
  width: 100%;
  height: 123.89%;
  left: 0;
  top: -23.9%;
}
.card-image--squirrel {
  width: 100%;
  height: 123.89%;
  left: 0;
  top: -0.42%;
}

.card-body {
  margin-top: var(--space-6);
  font-family: var(--font-sans);
  font-size: 14.5px;
  line-height: 1.3;
  color: #7d7981;
  flex: 1;
  overflow: hidden;
}

/* Frosted overlay for mid/back slots */
.slot-blur {
  position: absolute;
  inset: 0;
  border-radius: var(--radius-xl);
  pointer-events: none;
}

/* ── PROGRESS DOTS ─────────────────────────────────────────── */
#progress {
  margin-top: var(--space-6);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 24px;
  border-radius: 50px;
}
.dot {
  width: 8px; height: 8px;
  border-radius: 50px;
  background: var(--olive-200);
  transition: background 0.3s ease;
  flex-shrink: 0;
}
.dot.active { background: var(--olive); }
</style>
</head>
<body>

<div id="stage">
  <div id="column">
    <div class="species-pill">Quercus agrifolia</div>
    <h1 class="story-title">The Story of<br>a <em>Keystone</em></h1>

    <div id="deck">
    </div>

    <div id="progress"></div>
  </div>

  <button class="back-btn" onclick="history.back()" aria-label="Back">
    <span class="glass"><span class="depth"></span></span>
    <svg width="20" height="17" viewBox="0 0 20 17" fill="none" aria-hidden="true">
      <path d="M8.5 1 L1 8.5 L8.5 16 M1 8.5 H19" stroke="#252024" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>

<script>
/* ── Card Data — Figma node 1346:81158 ──────────────────────── */
const CARDS = [
  {
    title: 'An Ecosystem\nLives Here.',
    body:  'Over 270 species of birds, mammals, and insects depend on the Coast Live Oak for food and shelter. From acorn woodpeckers storing their harvest in its bark to the California oak moth whose caterpillars feed exclusively on its leaves.',
    img:   'assets/find-details/learn-v2/story-ecosystem-figma-card.jpg',
    imageClass: 'card-image--ecosystem',
  },
  {
    title: '5000 Years\nOn the Table.',
    body:  'At least twelve distinct Native American cultures, including the Chumash, Ohlone, and Cahuilla, relied on Coast Live Oak acorns as a dietary staple. Ground into flour, leached of tannis, and cooked into bread or mush.',
    img:   'assets/find-details/learn-v2/story-acorn-table-card.jpg',
    imageClass: 'card-image--acorn',
  },
  {
    title: 'Planted by\nForgetful Squirrels.',
    body:  'Coast Live Oak acorns are too heavy to travel by wind, so the tree often gets help from animals. Squirrels bury acorns as future snacks, but the ones they forget can sprout into new oaks.',
    img:   'assets/find-details/learn-v2/story-squirrel-card.jpg',
    imageClass: 'card-image--squirrel',
  },
];

CARDS.forEach(c => { const i = new Image(); i.src = c.img; });

/* ── Stack Geometry — Figma node 1711:181873 ────────────────── */
const POS = {
  front: { tx: 0,      ty: 41,     s: 1             },
  mid:   { tx: 15.779, ty: 19.163, s: 300 / 328     },
  back:  { tx: 31.049, ty: 0,      s: 270.912 / 328 },
};
const BLUR_PX    = { mid: 1.0,  back: 2.5  };
const BLUR_ALPHA = { mid: 0.12, back: 0.20 };

/* ── State ──────────────────────────────────────────────────── */
let activeIdx  = 0;
let drag       = null;
let stageScale = 1;

const DRAG_MIN    = 4;    // px before the card starts following
const THROW_DIST  = 75;   // px to trigger throw
const THROW_VEL   = 0.3;  // px/ms to trigger throw by velocity
const THROW_MS    = 360;

/* ── Stage Scaling ──────────────────────────────────────────── */
function fitStage() {
  stageScale = Math.min(window.innerWidth / 402, window.innerHeight / 874);
  document.getElementById('stage').style.transform =
    `translate(-50%, -50%) scale(${stageScale})`;
}
window.addEventListener('resize', fitStage);
fitStage();

/* ── Helpers ────────────────────────────────────────────────── */
const lerp = (a, b, t) => a + (b - a) * t;

function posTransform(posKey, dx = 0, dy = 0, rot = 0) {
  const { tx, ty, s } = POS[posKey];
  const rotStr = rot ? ` rotate(${rot}deg)` : '';
  return `translate(${tx + dx}px, ${ty + dy}px) scale(${s})${rotStr}`;
}

function getSlot(pos) {
  return document.querySelector(`#deck [data-pos="${pos}"]`);
}

/* ── Build Deck ─────────────────────────────────────────────── */
function buildDeck() {
  const deck = document.getElementById('deck');
  deck.querySelectorAll('.card-slot').forEach(el => el.remove());

  // Render back → mid → front (front painted last)
  const ORDER  = ['back', 'mid', 'front'];
  const OFFSET = { front: 0, mid: 1, back: 2 };

  ORDER.forEach(pos => {
    const cardIdx = (activeIdx + OFFSET[pos]) % CARDS.length;

    const card = CARDS[cardIdx];
    const slot = document.createElement('div');
    slot.className   = 'card-slot';
    slot.dataset.pos = pos;
    slot.style.zIndex    = pos === 'front' ? 3 : pos === 'mid' ? 2 : 1;
    slot.style.transform = posTransform(pos);

    slot.innerHTML = `
      <div class="learning-card">
        <h2 class="card-title">${card.title.replace('\n', '<br>')}</h2>
        <div class="card-img-wrap">
          <img class="${card.imageClass}" src="${card.img}" alt="" draggable="false">
        </div>
        <p class="card-body">${card.body}</p>
      </div>
      <div class="slot-blur"></div>
    `;

    if (pos !== 'front') {
      const blurEl = slot.querySelector('.slot-blur');
      blurEl.style.background           = `rgba(216,201,184,${BLUR_ALPHA[pos]})`;
      blurEl.style.backdropFilter       = `blur(${BLUR_PX[pos]}px)`;
      blurEl.style.webkitBackdropFilter = `blur(${BLUR_PX[pos]}px)`;
    }

    deck.appendChild(slot);
  });

  const front = getSlot('front');
  if (front) front.addEventListener('pointerdown', onDown, { passive: false });

  updateDots();
}

/* ── Progress Dots ──────────────────────────────────────────── */
function updateDots() {
  const activeDot = activeIdx % CARDS.length;
  document.getElementById('progress').innerHTML =
    CARDS.map((_, i) =>
      `<div class="dot${i === activeDot ? ' active' : ''}"></div>`
    ).join('');
}

/* ── Drag / Swipe ───────────────────────────────────────────── */
function onDown(e) {
  if (drag) return;
  e.preventDefault();

  drag = {
    startX: e.clientX,
    startY: e.clientY,
    dx: 0, dy: 0,
    vx: 0, vy: 0,
    lastX: e.clientX,
    lastY: e.clientY,
    lastT: performance.now(),
  };

  document.addEventListener('pointermove', onMove, { passive: false });
  document.addEventListener('pointerup',     onUp);
  document.addEventListener('pointercancel', onUp);
}

function onMove(e) {
  if (!drag) return;
  e.preventDefault();

  // Scale-compensated deltas so the card tracks the finger exactly
  const dx = (e.clientX - drag.startX) / stageScale;
  const dy = (e.clientY - drag.startY) / stageScale;

  // Exponential moving average velocity (px/ms)
  const now = performance.now();
  const dt  = now - drag.lastT || 1;
  drag.vx   = drag.vx * 0.65 + (e.clientX - drag.lastX) / stageScale / dt * 0.35;
  drag.vy   = drag.vy * 0.65 + (e.clientY - drag.lastY) / stageScale / dt * 0.35;
  drag.lastX = e.clientX;
  drag.lastY = e.clientY;
  drag.lastT = now;
  drag.dx = dx;
  drag.dy = dy;

  if (Math.sqrt(dx * dx + dy * dy) < DRAG_MIN) return;
  applyLiveDrag(dx, dy);
}

function applyLiveDrag(dx, dy) {
  const front = getSlot('front');
  const mid   = getSlot('mid');
  const back  = getSlot('back');
  if (!front) return;

  const rot = Math.max(-20, Math.min(20, dx * 0.06));

  front.style.transition = 'none';
  front.style.transform  = posTransform('front', dx, dy, rot);

  // Promote mid/back from total 2D distance
  const dist = Math.sqrt(dx * dx + dy * dy);
  const t = Math.min(dist / (THROW_DIST * 1.6), 1);

  if (mid) {
    const tx = lerp(POS.mid.tx, POS.front.tx, t);
    const ty = lerp(POS.mid.ty, POS.front.ty, t);
    const s  = lerp(POS.mid.s,  POS.front.s,  t);
    mid.style.transition = 'none';
    mid.style.transform  = `translate(${tx}px,${ty}px) scale(${s})`;
    const blurEl = mid.querySelector('.slot-blur');
    if (blurEl) blurEl.style.opacity = 1 - t;
  }
  if (back) {
    const tx = lerp(POS.back.tx, POS.mid.tx, t);
    const ty = lerp(POS.back.ty, POS.mid.ty, t);
    const s  = lerp(POS.back.s,  POS.mid.s,  t);
    back.style.transition = 'none';
    back.style.transform  = `translate(${tx}px,${ty}px) scale(${s})`;
  }
}

function onUp() {
  if (!drag) return;
  document.removeEventListener('pointermove', onMove);
  document.removeEventListener('pointerup',     onUp);
  document.removeEventListener('pointercancel', onUp);

  const { dx, dy, vx, vy } = drag;
  drag = null;

  const dist  = Math.sqrt(dx * dx + dy * dy);
  const speed = Math.sqrt(vx * vx + vy * vy);

  if (dist > THROW_DIST || speed > THROW_VEL) {
    throwCard(dx, dy, vx, vy);
  } else {
    snapBack();
  }
}

/* ── Throw ──────────────────────────────────────────────────── */
function throwCard(dx, dy, vx, vy) {
  const front = getSlot('front');
  const mid   = getSlot('mid');
  const back  = getSlot('back');
  if (!front) return;

  // Direction: prefer velocity vector, fall back to displacement
  const speed = Math.sqrt(vx * vx + vy * vy);
  let nx, ny;
  if (speed > 0.02) {
    nx = vx / speed;
    ny = vy / speed;
  } else {
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    nx = dx / d;
    ny = dy / d;
  }

  const EXTRA   = 1000;
  const finalDX = dx + nx * EXTRA;
  const finalDY = dy + ny * EXTRA;
  const rot     = nx * 24;

  front.style.pointerEvents = 'none';
  front.style.transition = `transform ${THROW_MS}ms cubic-bezier(0.22, 0, 0.5, 1)`;
  front.style.transform  = posTransform('front', finalDX, finalDY, rot);

  // Mid → front, back → mid with a spring pop
  const POP = `${Math.round(THROW_MS * 0.8)}ms cubic-bezier(0.22, 1.2, 0.36, 1)`;

  if (mid) {
    mid.style.transition = `transform ${POP}`;
    mid.style.transform  = posTransform('front');
    const blurEl = mid.querySelector('.slot-blur');
    if (blurEl) {
      blurEl.style.transition = `opacity ${Math.round(THROW_MS * 0.8)}ms ease`;
      blurEl.style.opacity    = '0';
    }
  }
  if (back) {
    back.style.transition = `transform ${POP}`;
    back.style.transform  = posTransform('mid');
    const blurEl = back.querySelector('.slot-blur');
    if (blurEl) {
      blurEl.style.transition = `opacity ${Math.round(THROW_MS * 0.8)}ms ease`;
      blurEl.style.opacity    = String(BLUR_ALPHA.mid / BLUR_ALPHA.back);
    }
  }

  // Advance after the throw completes (timeout fallback if the
  // transitionend event is swallowed by an interrupted animation)
  let advanced = false;
  const advance = () => {
    if (advanced) return;
    advanced = true;
    activeIdx++;
    buildDeck();
  };
  front.addEventListener('transitionend', advance, { once: true });
  setTimeout(advance, THROW_MS + 60);
}

/* ── Snap Back ──────────────────────────────────────────────── */
function snapBack() {
  const SPRING = '0.42s cubic-bezier(0.34, 1.56, 0.64, 1)';

  ['front', 'mid', 'back'].forEach(pos => {
    const slot = getSlot(pos);
    if (!slot) return;

    slot.style.transition = `transform ${SPRING}`;
    slot.style.transform  = posTransform(pos);

    const blurEl = slot.querySelector('.slot-blur');
    if (blurEl && pos !== 'front') {
      blurEl.style.transition = 'opacity 0.3s ease';
      blurEl.style.opacity    = '1';
    }
  });
}

/* ── Init ───────────────────────────────────────────────────── */
buildDeck();
</script>
</body>
</html>
